[pytest]

# Tell pytest that the repository root should be included
# in Python's import path.
#
# This allows tests to import project modules such as:
#
#     from src.models.train import ...
#     from src.features.engineering import ...
#
# It makes local and GitHub Actions test environments
# behave consistently.
pythonpath = .

# Tell pytest where the project's tests are located.
testpaths = tests