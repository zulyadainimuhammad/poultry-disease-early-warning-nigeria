name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Compare Random Forest with historical baselines on matched folds
        run: python scripts/compare_matched_baselines.py

      - name: Upload matched baseline evaluation
        uses: actions/upload-artifact@v4
        with:
          name: matched-baseline-evaluation
          path: |
            artifacts/evaluation/matched_baseline_comparison.json
            artifacts/evaluation/matched_baseline_oos_predictions.csv
